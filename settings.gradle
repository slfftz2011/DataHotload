pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'datahotload'

include 'core'

// Fabric
include 'fabric:V1_21_1'
project(':fabric:V1_21_1').projectDir = file('fabric/V1_21_1')

// NeoForge
include 'neoforge:V1_21_1'
project(':neoforge:V1_21_1').projectDir = file('neoforge/V1_21_1')

// Bukkit
include 'bukkit:V1_21_1'
project(':bukkit:V1_21_1').projectDir = file('bukkit/V1_21_1')

