plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

dependencies {
    // Core has no loader dependencies - pure Java
    // SLF4J API only at compile time; the runtime implementation is provided by the loader (Log4j bridge)
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
}
