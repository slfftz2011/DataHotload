plugins {
    id 'net.neoforged.gradle.userdev' version "${neoforge_gradle_plugin_version}"
    id 'java'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    // Core module (loader-agnostic business logic)
    implementation project(':core')
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', ''
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Expand placeholders in neoforge.mods.toml during processResources
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            modId             : mod_id,
            version           : mod_version,
            displayName       : mod_name,
            description       : mod_description,
            neoForgeVersion   : neoforge_version,
            minecraftVersion  : neoforge_minecraft_version
    ]
    inputs.properties replaceProperties

    filesMatching([
            'META-INF/neoforge.mods.toml',
    ]) {
        expand replaceProperties + [project: project]
    }
}
