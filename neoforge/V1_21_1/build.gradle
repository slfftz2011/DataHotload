plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.150'
    id 'java'
}

// NeoForge and Minecraft versions are defined in gradle.properties

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    // Core module (loader-agnostic business logic)
    implementation project(':core')
}

neoForge {
    version = project.neoForgeVersion

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', ''
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Expand placeholders in neoforge.mods.toml during processResources
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            modId             : project.modId,
            version           : project.version,
            displayName       : project.displayName,
            description       : project.description,
            neoForgeVersion   : project.neoForgeVersion,
            minecraftVersion  : project.minecraftVersion
    ]
    inputs.properties replaceProperties

    filesMatching([
            'META-INF/neoforge.mods.toml',
    ]) {
        expand replaceProperties + [project: project]
    }
}
