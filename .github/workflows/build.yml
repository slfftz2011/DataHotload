name: Build All

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Build Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Core
        run: ./gradlew :core:build --no-daemon

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-jar
          path: core/build/libs/*.jar

  build-fabric:
    name: Build Fabric 1.21.1
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        run: ./gradlew :fabric:V1_21_1:build --no-daemon

      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-1.21.1-jar
          path: fabric/V1_21_1/build/libs/*.jar

  build-neoforge:
    name: Build NeoForge 1.21.1
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        run: ./gradlew :neoforge:V1_21_1:build --no-daemon

      - name: Upload NeoForge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1-jar
          path: neoforge/V1_21_1/build/libs/*.jar

  build-bukkit:
    name: Build Bukkit/Paper 1.21
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bukkit
        run: ./gradlew :bukkit:V1_21_1:build --no-daemon

      - name: Upload Bukkit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bukkit-1.21-jar
          path: bukkit/V1_21_1/build/libs/*.jar
