name: Manual Build

on:
  workflow_dispatch:
    inputs:
      loader:
        description: 'Loader to build'
        required: true
        type: choice
        options:
          - all
          - fabric
          - neoforge
          - bukkit
          - core
      version:
        description: 'Game version (e.g., V1_21_1)'
        required: false
        default: 'V1_21_1'
        type: string

jobs:
  build-selected:
    name: Build ${{ github.event.inputs.loader }} ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Core (always)
        run: ./gradlew :core:build --no-daemon

      - name: Build Fabric
        if: ${{ github.event.inputs.loader == 'all' || github.event.inputs.loader == 'fabric' }}
        run: ./gradlew :fabric:${{ github.event.inputs.version }}:build --no-daemon

      - name: Build NeoForge
        if: ${{ github.event.inputs.loader == 'all' || github.event.inputs.loader == 'neoforge' }}
        run: ./gradlew :neoforge:${{ github.event.inputs.version }}:build --no-daemon

      - name: Build Bukkit
        if: ${{ github.event.inputs.loader == 'all' || github.event.inputs.loader == 'bukkit' }}
        run: ./gradlew :bukkit:${{ github.event.inputs.version }}:build --no-daemon

      - name: Upload All Jars
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.loader }}-${{ github.event.inputs.version }}-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
